name: HostLink source validation

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux source and artifact contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
      - name: Format
        run: cargo +1.98.1 fmt --all -- --check
      - name: Compile workspace
        run: cargo +1.98.1 check --workspace --all-targets --locked
      - name: Strict Clippy
        run: cargo +1.98.1 clippy --workspace --all-targets --locked -- -D warnings
      - name: Unit and loopback integration tests
        run: cargo +1.98.1 test --workspace --locked
      - name: Static architecture and packaging tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Build source-exact Linux binaries
        run: cargo +1.98.1 build --locked --release --bin hostlink --bin hostlink-hub --bin hostlink-agent
      - name: Verify independent Linux ZIP inventories and digests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .dist/staging .dist/out
          cp target/release/hostlink target/release/hostlink-hub target/release/hostlink-agent .dist/staging/
          python scripts/package_hostlink.py controller x86_64-unknown-linux-gnu .dist/staging .dist/out
          python scripts/package_hostlink.py hub x86_64-unknown-linux-gnu .dist/staging .dist/out
          python scripts/package_hostlink.py agent x86_64-unknown-linux-gnu .dist/staging .dist/out
          (cd .dist/out && sha256sum -c -- *.sha256)

  windows-current:
    name: Current Windows x64 compile and package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy
      - name: Compile Windows sources and tests
        run: cargo +1.98.1 check --workspace --all-targets --locked
      - name: Strict Windows Clippy
        run: cargo +1.98.1 clippy --workspace --all-targets --locked -- -D warnings
      - name: Build Windows controller and Agent
        run: cargo +1.98.1 build --locked --release --bin hostlink --bin hostlink-agent
      - name: Verify independent Windows ZIP inventories
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force '.dist/staging', '.dist/out' | Out-Null
          Copy-Item -Path 'target/release/hostlink.exe', 'target/release/hostlink-agent.exe' -Destination '.dist/staging/'
          Copy-Item -Path 'crates/onec-agent/assets/Install-HostLink-Agent.ps1', 'crates/onec-agent/assets/Run-HostLink-Agent.ps1', 'crates/onec-agent/assets/Update-HostLink-Agent.ps1' -Destination '.dist/staging/'
          python scripts/package_hostlink.py controller x86_64-pc-windows-msvc .dist/staging .dist/out
          if ($LASTEXITCODE -ne 0) { throw "Windows controller packaging failed" }
          python scripts/package_hostlink.py agent x86_64-pc-windows-msvc .dist/staging .dist/out
          if ($LASTEXITCODE -ne 0) { throw "Windows Agent packaging failed" }
          Get-ChildItem '.dist/out/*.sha256' | ForEach-Object {
            $line = [System.IO.File]::ReadAllText($_.FullName).Trim()
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw "Invalid SHA sidecar" }
            $expected = $Matches[1]
            $archive = $Matches[2]
            $actual = (Get-FileHash (Join-Path $_.DirectoryName $archive) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "Artifact SHA mismatch" }
          }

# Win7 x64/x86 are Tier-3 custom toolchains, not covered by this workflow.
# Neither this workflow nor packaging claims NT6.1 native/runtime acceptance.
