[package]
name = "hostlink-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
russh.workspace = true
russh-sftp.workspace = true
tokio.workspace = true
tokio-util.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
base64.workspace = true
semver.workspace = true
zip.workspace = true
tempfile.workspace = true
thiserror.workspace = true
uuid.workspace = true
ulid.workspace = true
secrecy.workspace = true
processkit.workspace = true
rand.workspace = true
self_update = { version = "=1.3.1", default-features = false, features = ["archive-zip", "compression-zip-deflate", "rustls", "ureq"] }
hostlink-hub = { path = "../hub", default-features = false }
reqwest.workspace = true

apalis-board-api.workspace = true
axum.workspace = true
apalis-core.workspace = true
apalis-sqlite.workspace = true
sqlx.workspace = true
futures.workspace = true
tower.workspace = true
tower-http.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
service-manager = { version = "=0.11.0", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", default-features = false, features = ["Win32_System_Com", "Win32_System_TaskScheduler", "Win32_System_Variant", "Win32_System_Ole"] }
roxmltree = "=0.21.1"
windows-permissions = "0.2.4"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell"] }

[dev-dependencies]
roxmltree = "=0.21.1"
hostlink-hub = { path = "../hub", features = ["server"] }
tower.workspace = true
