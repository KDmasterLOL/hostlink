<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>New command</title>
<h1>New command</h1><p>Commands run on this Agent. After a crash Apalis may repeat a command and its side effects. This form submits one attempt; the direct Board API may request retries. No shell is used unless explicitly requested.</p>
<form id="command"><p><label>Program <input id="program" required></label></p><p><label>Arguments (JSON array of strings)<br><textarea id="args" rows="5">[]</textarea></label></p><p><label>Working directory (optional) <input id="cwd"></label></p><button>Queue command</button></form><p id="result" role="status" aria-live="polite"></p><p><a href="/">Board</a></p>
<script>document.querySelector('#command').addEventListener('submit',async e=>{e.preventDefault();const result=document.querySelector('#result');try{const args=JSON.parse(document.querySelector('#args').value);if(!Array.isArray(args)||!args.every(x=>typeof x==='string'))throw Error('Arguments must be a JSON array of strings');const response=await fetch('/api/v1/queues/commands/tasks',{method:'PUT',headers:{'Content-Type':'application/json','x-task-max-attempts':'1'},body:JSON.stringify({program:document.querySelector('#program').value,args,cwd:document.querySelector('#cwd').value||null})});result.textContent=response.ok?'Command queued.':`Queue failed: ${response.status} ${await response.text()}`;}catch(error){result.textContent=error.message;}});</script></html>
