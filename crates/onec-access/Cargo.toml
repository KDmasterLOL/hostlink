[package]
name = "onec-access"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
repository.workspace = true
homepage.workspace = true
description = "Controller-side managed-machine access for onec-hub/onec-agent fleets"

[[bin]]
name = "onec-access"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
bon.workspace = true
clap.workspace = true
directories.workspace = true
ed25519-dalek = "=2.2.0"
hex.workspace = true
onec-agent-protocol = { path = "../onec-agent-protocol" }
hostlink-core = { path = "../hostlink-core" }
onec-hub = { path = "../onec-hub", default-features = false }
reqwest = { version = "0.12.24", default-features = false, features = ["charset", "cookies", "json", "rustls-tls"] }
russh.workspace = true
russh-sftp.workspace = true
secrecy = { workspace = true, features = ["serde"] }
semver = "1.0.27"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ssh-key.workspace = true
shlex.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs"] }
uuid.workspace = true

[dev-dependencies]
rand = "0.10.2"
tempfile.workspace = true
