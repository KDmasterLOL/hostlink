[workspace]
members = [
    "crates/onec-access",
    "crates/onec-hub",
    "crates/onec-agent",
    "crates/onec-agent-protocol",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
repository = "https://github.com/KDmasterLOL/hostlink"
homepage = "https://github.com/KDmasterLOL/hostlink"

[workspace.dependencies]
anyhow = "1.0.104"
aho-corasick = "1.1.5"
atomicwrites = "0.4.4"
askama = { version = "0.16.1", default-features = false, features = ["derive", "std"] }
base64 = "0.22.1"
bon = "=3.10.1"
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
chrono = { version = "0.4.42", features = ["clock", "serde"] }
clap = { version = "=4.6.6", features = ["derive"] }
ctrlc = "3.5.0"
directories = "6.0.0"
enum-assoc = "=1.4.1"
dotenv = { package = "dotenv-ng", version = "1.0.0" }
encoding_rs = "0.8.41"
indicatif = "0.18.0"
flate2 = "1.1.9"
file-rotate = "=0.8.0"
fs4 = "1.1.0"
garde = { version = "0.23.0", features = ["derive"] }
getrandom = "0.4.3"
hex = "0.4.3"
hostname = "0.4.2"
httpdate = "1.0.3"
humantime = "2.4.0"
libc = "0.2.177"
merge3 = "0.2.1"
miniz_oxide = "0.8.9"
mime = "0.3.17"
nix = { version = "0.31.3", default-features = false, features = ["signal"] }
nutype = "=0.8.0"
percent-encoding = "2.3.2"
process-wrap = { version = "10.0.0", default-features = false, features = ["std", "tokio1", "creation-flags", "job-object", "process-group", "kill-on-drop"] }
processkit = "=3.3.4"
quick-xml = { version = "=0.42.0", features = ["serialize"] }
rawzip = "0.5.1"
rayon = "1.11.0"
roxmltree = { version = "=0.21.1", features = ["positions"] }
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "charset", "cookies", "json", "rustls-tls"] }
russh = { version = "=0.63.3", default-features = false, features = ["ring", "flate2"] }
russh-sftp = "=3.0.0"
self_update = { version = "=1.3.1", default-features = false, features = ["ureq", "rustls", "archive-zip", "compression-zip-deflate", "checksums"] }
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
scraper = "0.27.0"
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
same-file = "1.0.6"
sha2 = "0.10.9"
ssh-key = { version = "=0.7.0-rc.11", default-features = false, features = ["alloc"] }
shlex = "2.0.1"
strum = { version = "0.28.0", features = ["derive"] }
syn = { version = "2.0.119", features = ["full", "extra-traits"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"
proc-macro-crate = "=3.4.0"
trybuild = "=1.0.116"
trycmd = "=1.2.1"
subtle = "2.6.1"
hmac = "0.12.1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "time"] }
tower = { version = "0.5.3", features = ["limit", "load-shed", "timeout", "util"] }
tower-http = { version = "0.6.11", features = ["limit", "set-header"] }
tempfile = "3.27.0"
thiserror = "2.0.17"
toml = "0.9"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tree-sitter = "0.25.10"
tree-sitter-bsl = "0.1.7"
url = "2.5.8"
uuid = { version = "1.18.1", features = ["v4"] }
unicode-width = "0.2.2"
walkdir = "2.5.0"
windows = { version = "0.61.3", features = ["Win32_System_Threading"] }
windows-permissions = "0.2.4"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
xmltree = { version = "0.12.0", features = ["attribute-order"] }
zip = { version = "9.0.0", default-features = false, features = ["deflate"] }

[patch.crates-io]
dirs-sys = { path = "vendor/dirs-sys" }
file-rotate = { path = "vendor/file-rotate" }
process-wrap = { path = "vendor/process-wrap" }
processkit = { path = "vendor/processkit" }
pageant = { path = "vendor/pageant" }
