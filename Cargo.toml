[workspace]
members = ["crates/agent", "crates/client", "crates/hub"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
repository = "https://github.com/KDmasterLOL/hostlink"

[workspace.dependencies]
russh = { version = "=0.63.3", default-features = false, features = ["ring", "flate2"] }
russh-sftp = "=3.0.0"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
clap = { version = "=4.6.6", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
base64 = "0.22.1"
semver = "=1.0.28"
zip = { version = "=6.0.0", default-features = false, features = ["deflate"] }
libc = "=0.2.191"
thiserror = "2.0.17"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
tempfile = "3.27.0"
secrecy = "0.10.3"
processkit = "=3.3.4"
rand = "0.10.2"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tower = { version = "=0.5.3", features = ["util", "limit"] }
ssh-key = { version = "=0.7.0-rc.11", default-features = false, features = ["alloc"] }
getrandom = "=0.4.3"
hex = "=0.4.3"
url = "=2.5.8"
subtle = "=2.6.1"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }

apalis-core = "=1.0.0"
apalis-sqlite = { version = "=1.0.0", default-features = false, features = ["migrate", "json"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["sqlite", "runtime-tokio"] }
futures = "0.3.34"
